# Quality gate for pull requests and master.
#
# Until this existed, every check in the repo was local-and-opt-in: husky could
# be skipped with --no-verify and nothing else ran. Formatting had drifted on 68
# files and `vue-tsc` reported 52 errors while the docs called it "the gate".
#
# Deploys still live in deploy-pi.yml; this workflow never touches the Pi.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One in-flight run per branch/PR — newer pushes supersede older checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Git hooks are pointless on a runner and `prepare` would install them.
      HUSKY: 0
      npm_config_fund: false
      npm_config_audit: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile is npm 12 format: `npm ci` on npm <= 11 fails with a
      # confusing "Missing: cac@6.7.14 from lock file". Node 26 still ships
      # npm 11.x, so pin the same version docker/Dockerfile.prod installs.
      - name: Pin npm to the version that owns the lockfile
        run: |
          npm install -g npm@12.0.2
          node -v && npm -v

      # Also runs `nuxt prepare`, which generates .nuxt/tsconfig.json — the
      # config tsconfig.json extends, so typecheck depends on this step.
      - name: Install dependencies
        run: npm ci

      # Every check below runs even when an earlier one fails, so a PR gets the
      # complete list of problems in one round trip instead of one per push.
      - name: Scan for secrets
        if: ${{ !cancelled() }}
        run: npm run scan:secrets

      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: node scripts/npm-prod-audit.mjs

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # Public-route Playwright smoke against Nitro preview + ephemeral MySQL.
  # Use the official Playwright image so Chromium + OS deps are preinstalled
  # (avoids hanging `playwright install --with-deps` on ubuntu-latest).
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rc_test
        # Job runs in a container → reach MySQL by service hostname, not localhost.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      HUSKY: 0
      npm_config_fund: false
      npm_config_audit: false
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: test
      DB_NAME: rc_test
      JWT_SECRET: ci-e2e-test-secret-min-16chars
      COOKIE_SECURE: "false"
      ALLOW_ROOT_DB: "1"
      # Do not set NODE_ENV=production at job level — npm ci would omit
      # devDependencies (husky, playwright, tsx) and fail prepare/e2e.
      # Browsers ship in the container image; skip any download attempts.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version that owns the lockfile
        run: |
          npm install -g npm@12.0.2
          node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: node --import tsx scripts/migrate.ts up

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Smoke tests
        env:
          NODE_ENV: production
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Sprint F scaffold (`tests/integration/*`) — runs against an ephemeral
  # MySQL 8. Unit job above stays DB-free; suites skip unless DB_INTEGRATION=1.
  integration:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      HUSKY: 0
      npm_config_fund: false
      npm_config_audit: false
      DB_INTEGRATION: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: test
      DB_NAME: rc_test
      # Pool helpers / auth utils may read this; not used for signing in IT.
      JWT_SECRET: ci-integration-test-secret-min-16chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version that owns the lockfile
        run: |
          npm install -g npm@12.0.2
          node -v && npm -v

      - name: Install dependencies
        run: npm ci

      # No `.env` on the runner — DB_* come from the job env above.
      - name: Apply migrations
        run: node --import tsx scripts/migrate.ts up

      - name: Integration tests
        run: npm run test:integration
