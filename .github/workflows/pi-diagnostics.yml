name: Pi diagnostics (logs)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pi-diagnostics.yml"

jobs:
  diagnose:
    name: Dump prod container logs
    runs-on: [self-hosted, management]
    timeout-minutes: 10
    steps:
      # No actions/checkout — avoids _work/_actions permission traps when the
      # runner user and cached action files disagree (root vs login user).
      - name: Heal runner _work ownership
        run: |
          set -euo pipefail
          echo "=== identity ==="
          id; echo "HOME=${HOME:-}"; echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-}"
          echo
          RUNNER_DIR=""
          if [[ -n "${GITHUB_WORKSPACE:-}" && "${GITHUB_WORKSPACE}" =~ ^(/home/[^/]+)/actions-runner/ ]]; then
            RUNNER_DIR="${BASH_REMATCH[1]}/actions-runner"
          elif [[ -d "${HOME}/actions-runner" ]]; then
            RUNNER_DIR="${HOME}/actions-runner"
          fi
          echo "RUNNER_DIR=${RUNNER_DIR:-unset}"
          if [[ -z "${RUNNER_DIR}" || ! -d "${RUNNER_DIR}/_work" ]]; then
            echo "No runner _work dir to heal"
            exit 0
          fi
          echo "=== _work ownership (before) ==="
          ls -la "${RUNNER_DIR}/_work" || true
          ls -la "${RUNNER_DIR}/_work/_actions" 2>/dev/null | head -20 || true
          OWNER="$(stat -c '%U' "${RUNNER_DIR}" 2>/dev/null || true)"
          echo "runner dir owner=${OWNER:-unknown}"
          # Prefer the login user that owns the runner install (not process HOME
          # when it is wrongly /root).
          TARGET_USER="${OWNER}"
          if [[ -z "${TARGET_USER}" || "${TARGET_USER}" == "UNKNOWN" ]]; then
            TARGET_USER="$(id -un)"
          fi
          if [[ -d "${RUNNER_DIR}/_work/_actions" ]]; then
            echo "Healing ownership of ${RUNNER_DIR}/_work → ${TARGET_USER}"
            if sudo -n chown -R "${TARGET_USER}:${TARGET_USER}" "${RUNNER_DIR}/_work" 2>/dev/null; then
              echo "chown OK"
            else
              echo "sudo chown failed — trying rm _actions cache"
              sudo -n rm -rf "${RUNNER_DIR}/_work/_actions" 2>/dev/null \
                || rm -rf "${RUNNER_DIR}/_work/_actions" 2>/dev/null \
                || echo "WARN: could not heal _actions (manual: sudo chown -R ${TARGET_USER}: ${RUNNER_DIR}/_work)"
            fi
          fi
          echo "=== _work ownership (after) ==="
          ls -la "${RUNNER_DIR}/_work" || true
          touch "${RUNNER_DIR}/_work/.mgmt-write-test" 2>/dev/null \
            && rm -f "${RUNNER_DIR}/_work/.mgmt-write-test" \
            && echo "write test OK" \
            || echo "WARN: still cannot write _work"

      - name: Container status + recent app logs
        run: |
          set -euo pipefail
          echo "=== hostname / uptime ==="
          hostname; uptime; date -u
          echo
          echo "=== podman ps ==="
          podman ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo
          echo "=== compose ps ==="
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          cd "$ROOT"
          if [[ -f docker/docker-compose.prod.yml ]]; then
            uv run --project . podman-compose -f docker/docker-compose.prod.yml ps 2>/dev/null || true
          fi
          echo
          APP=$(podman ps -a --format '{{.Names}}' | grep -E 'mgmt-app|app-prod' | head -1 || true)
          NGINX=$(podman ps -a --format '{{.Names}}' | grep -E 'nginx' | head -1 || true)
          MYSQL=$(podman ps -a --format '{{.Names}}' | grep -E 'mysql' | head -1 || true)
          echo "APP=$APP NGINX=$NGINX MYSQL=$MYSQL"
          echo
          if [[ -n "$APP" ]]; then
            echo "=== $APP logs (last 400) ==="
            podman logs --tail 400 "$APP" 2>&1 || true
          fi
          echo
          if [[ -n "$NGINX" ]]; then
            echo "=== $NGINX logs (last 100) ==="
            podman logs --tail 100 "$NGINX" 2>&1 || true
          fi
          echo
          echo "=== health from localhost ==="
          curl -sS -m 5 http://127.0.0.1:8080/api/health || true
          echo
          curl -sS -m 5 -o /dev/null -w 'home=%{http_code}\n' http://127.0.0.1:8080/ || true
          curl -sS -m 5 -o /dev/null -w 'feed=%{http_code}\n' http://127.0.0.1:8080/api/feed || true
          curl -sS -m 5 -o /dev/null -w 'auth_me=%{http_code}\n' http://127.0.0.1:8080/api/auth/me || true
          echo
          echo "=== recent 5xx from nginx access if present ==="
          if [[ -n "$NGINX" ]]; then
            podman exec "$NGINX" sh -c 'tail -n 400 /var/log/nginx/access.log 2>/dev/null | grep " 5[0-9][0-9] " || true' 2>/dev/null || true
            podman exec "$NGINX" sh -c 'tail -n 80 /var/log/nginx/error.log 2>/dev/null || true' 2>/dev/null || true
          fi
          echo
          echo "=== cloudflare tunnel unit (if any) ==="
          systemctl --user status mgmt-cloudflare-tunnel --no-pager -l 2>/dev/null | head -40 || true
          journalctl --user -u mgmt-cloudflare-tunnel -n 50 --no-pager 2>/dev/null || true
          echo
          echo "=== app env sanity (no secrets) ==="
          if [[ -n "$APP" ]]; then
            podman exec "$APP" sh -c 'echo NODE_ENV=$NODE_ENV; echo APP_BASE_URL=$APP_BASE_URL; echo DB_HOST=$DB_HOST; printenv | grep -E "^(NUXT_|NITRO_|R2_|MYSQL_|DB_)" | sed "s/=.*/=***/" || true' 2>/dev/null || true
          fi

# diagnostics kick 20260808134000
