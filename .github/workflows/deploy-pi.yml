# Deploy to the Raspberry Pi on every push to master.
#
# Requires a GitHub Actions *self-hosted* runner on the Pi with labels:
#   self-hosted, linux, ARM64, management
#
# One-time Pi setup: bash docker/install-github-runner.sh
# Full notes:        implement/ci-cd.md
#
# Behaviour:
#   - Checks out the commit into the runner workspace (relative paths only)
#   - Syncs ops libs with `uv sync --frozen`
#   - Builds the app image (`npm ci` inside Dockerfile) via `uv run podman-compose`
#   - Runs DB migrations with the *new* image before switching the live app
#   - If build/migrate fails → running containers are left untouched
#   - If the new container fails health checks → previous image is restored

name: Deploy (Raspberry Pi)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tunnel_url:
        description: "Skip Cloudflare tunnel URL sync"
        type: boolean
        default: false

concurrency:
  group: deploy-pi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync, migrate & deploy on Pi
    runs-on: [self-hosted, linux, ARM64, management]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep local-only files on the self-hosted workspace between runs
          # (docker/.env.prod, docker/ssl/*, tunnel credentials).
          clean: false

      - name: Ensure uv
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          fi
          uv --version

      - name: Sync ops libraries (uv)
        run: uv sync --frozen

      - name: Deploy (build, migrate DB, restart, health-check)
        env:
          FULL_SHA: ${{ github.sha }}
          SKIP_TUNNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tunnel_url || false }}
        run: |
          set -euo pipefail
          export GIT_SHA
          GIT_SHA="$(git rev-parse --short "${FULL_SHA}")"
          EXTRA=()
          if [[ "${SKIP_TUNNEL}" == "true" ]]; then
            EXTRA+=(--skip-tunnel-url)
          fi
          # ci-deploy.sh also re-runs uv sync, builds (npm ci), migrates, then switches the app.
          bash docker/ci-deploy.sh "${EXTRA[@]}"
