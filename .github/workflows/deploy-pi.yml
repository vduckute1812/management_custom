# Deploy to the Raspberry Pi on every push to master.
#
# Requires a GitHub Actions *self-hosted* runner on the Pi that is Online/Idle.
# Register with: bash docker/install-github-runner.sh --url … --token …
# Full notes:    implement/ci-cd.md
#
# If a run stays "Queued", the runner is offline or not registered — GitHub
# will wait forever for a matching machine. Check:
#   Repo → Settings → Actions → Runners

name: Deploy (Raspberry Pi)

on:
  push:
    branches: [master]
    # Docs / agent rules / tests do not change the running image — skip the
    # ~15–25 min Pi rebuild. Touch any app/docker path to deploy.
    paths-ignore:
      - "**.md"
      - "implement/**"
      - ".cursor/**"
      - ".github/**"
      - ".husky/**"
      - "tests/**"
      - "vitest.config.ts"
      - ".prettierignore"
      - ".prettierrc.json"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  # Newest push wins — cancels older queued/in-progress deploys so a stuck
  # "Queued" run cannot block the pipeline forever.
  group: deploy-pi-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync, migrate & deploy on Pi
    # Only require the custom label. GitHub always adds self-hosted / OS / arch
    # automatically; requiring ARM64 broke 32-bit Pi images and mismatched
    # manual registrations that omitted the custom label.
    runs-on: [self-hosted, management]
    timeout-minutes: 60

    steps:
      # Self-hosted workspace persists across runs. Empty/corrupt loose objects
      # (often after SD-card power loss) make `actions/checkout` fetch fail with
      # "loose object … is empty/corrupt". Heal before checkout; secrets live in
      # ~/.config/management and are re-linked after a successful checkout.
      - name: Repair corrupt git workspace
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-.}"
          if [[ ! -d "${ws}/.git" ]]; then
            echo "No prior .git — fresh checkout will create it"
            exit 0
          fi
          # Drop zero-byte loose objects that break fetch/fsck.
          find "${ws}/.git/objects" -type f -size 0 -print -delete 2>/dev/null || true
          if git -C "${ws}" rev-parse --git-dir >/dev/null 2>&1 \
            && git -C "${ws}" fsck --no-progress --connectivity-only >/dev/null 2>&1; then
            echo "git workspace OK"
            exit 0
          fi
          echo "Corrupt git detected — removing .git for a clean checkout"
          rm -rf "${ws}/.git"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep local-only files on the self-hosted workspace between runs
          # (docker/ssl/*, tunnel credentials). Env secrets come from Doppler.
          clean: false

      - name: Ensure uv
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          fi
          uv --version

      - name: Ensure Doppler CLI
        run: |
          set -euo pipefail
          bash docker/install-doppler-cli.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          command -v doppler >/dev/null 2>&1 && doppler --version || true

      - name: Link Pi secrets into workspace
        env:
          # Override via repo variable if secrets live elsewhere under $HOME.
          MGMT_SECRETS_DIR: ${{ vars.MGMT_SECRETS_DIR }}
          # Prefer Doppler when configured (repo secret or Pi token file).
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
        run: |
          set -euo pipefail
          # Self-hosted runner may have HOME=/root while the install (and
          # ~/.config/management/doppler.token) lives under /home/<user>.
          if [[ -z "${MGMT_SECRETS_DIR:-}" ]]; then
            if [[ "${GITHUB_WORKSPACE}" =~ ^(/home/[^/]+)/ ]]; then
              _home="${BASH_REMATCH[1]}"
              if [[ -e "${_home}/.config/management" ]]; then
                export MGMT_SECRETS_DIR="${_home}/.config/management"
                export HOME="${_home}"
              fi
            fi
          fi
          export MGMT_SECRETS_DIR="${MGMT_SECRETS_DIR:-${HOME}/.config/management}"
          # Repo vars may arrive empty — fall back to script defaults.
          export DOPPLER_PROJECT="${DOPPLER_PROJECT:-management_custom}"
          export DOPPLER_CONFIG="${DOPPLER_CONFIG:-prd}"
          bash docker/link-secrets.sh

      - name: Deploy (build, migrate DB, restart, health-check)
        env:
          FULL_SHA: ${{ github.sha }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
          MGMT_SECRETS_DIR: ${{ vars.MGMT_SECRETS_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${MGMT_SECRETS_DIR:-}" ]]; then
            if [[ "${GITHUB_WORKSPACE}" =~ ^(/home/[^/]+)/ ]]; then
              _home="${BASH_REMATCH[1]}"
              if [[ -e "${_home}/.config/management" ]]; then
                export MGMT_SECRETS_DIR="${_home}/.config/management"
                export HOME="${_home}"
              fi
            fi
          fi
          export MGMT_SECRETS_DIR="${MGMT_SECRETS_DIR:-${HOME}/.config/management}"
          export GIT_SHA
          GIT_SHA="$(git rev-parse --short "${FULL_SHA}")"
          export DOPPLER_PROJECT="${DOPPLER_PROJECT:-management_custom}"
          export DOPPLER_CONFIG="${DOPPLER_CONFIG:-prd}"
          # ci-deploy.sh syncs uv, builds (layer-cached npm ci), migrates, switches the app.
          bash docker/ci-deploy.sh
