services:
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: mgmt-nginx-prod
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Rendered from nginx.prod.conf.template via docker/render-nginx-conf.sh
      # (LAN_IP). Do not edit the rendered file by hand.
      - ./nginx.prod.rendered.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: localhost/mgmt-app-prod:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: mgmt-app-prod
    ports:
      # Bind to the Pi LAN NIC only. Override with LAN_IP=… before compose.
      - "${LAN_IP:-192.168.1.4}:3000:3000"
    env_file:
      - .env.prod
    environment:
      # Podman on this Pi has no compose service-name DNS. Point at the
      # published LAN bind (same pattern as DB_HOST → ${LAN_IP}:3306).
      # Forces redis even if an old .env.prod left CACHE_DRIVER=memory.
      REDIS_URL: "redis://${LAN_IP:-192.168.1.4}:6379/0"
      CACHE_DRIVER: "redis"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Dockerfile HEALTHCHECK is the source of truth; compose mirrors it so
    # `podman ps` / compose status surface the same probe.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: mgmt-redis-prod
    restart: unless-stopped
    # Cache-only: no RDB/AOF (lighter on the Pi SD). Cap RAM + LRU eviction.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
      - "${LAN_IP:-192.168.1.4}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  mysql:
    image: docker.io/library/mysql:8.0
    container_name: mgmt-mysql-prod
    restart: unless-stopped
    command: --skip-host-cache --skip-name-resolve
    cap_add:
      - SYS_NICE
    # Secrets (MYSQL_ROOT_PASSWORD) come from the gitignored docker/.env.prod.
    # Prefer a dedicated app user (DB_USER/DB_PASS) for the Nitro process;
    # keep MYSQL_ROOT_PASSWORD for admin/migrate until that cutover is done.
    # See .env.example and implement/database.md.
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: "rc"
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      # Loopback for host-side tools. The LAN publish exists so the one-shot
      # migrate container (no service-name DNS on this Pi's podman network)
      # can reach MySQL via ${LAN_IP}:3306 — see docker/ci-deploy.sh
      # run_migrations. Do not drop the LAN bind without fixing that path.
      - "127.0.0.1:3306:3306"
      - "${LAN_IP:-192.168.1.4}:3306:3306"
    volumes:
      - mgmt-mysql-data:/var/lib/mysql
    healthcheck:
      # Use MYSQL_PWD so '@' in the password is not parsed as -p flag noise.
      # Avoid Docker-only $$ quoting that Podman healthchecks often mishandle.
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mgmt-mysql-data:
    external: true
    name: management_mgmt-mysql-data
